<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sleep" />
    <title>Sleep Advisor</title>
    <meta name="description" content="Your sleep schedule, built on your body clock and sleep research." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="src/ui/styles.css" />
  </head>
  <body>
    <main class="view" id="view-tonight" hidden></main>
    <main class="view" id="view-week" hidden></main>
    <main class="view" id="view-settings" hidden></main>
    <div class="onboard" id="onboard" hidden></div>
    <nav class="dock" id="dock" role="tablist" aria-label="Sections" hidden>
      <button class="tab" role="tab" data-view="tonight" aria-label="Tonight"></button>
      <button class="tab" role="tab" data-view="week" aria-label="Week"></button>
      <button class="tab" role="tab" data-view="settings" aria-label="Settings"></button>
    </nav>
    <script type="module" src="src/ui/app.js"></script>
  </body>
</html>
